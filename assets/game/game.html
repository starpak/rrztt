<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>星猫降临 · Galgame</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/style.css?v=20260808">
  <link rel="stylesheet" href="galgame-styles.css?v=20260808">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js" defer></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-background: var(--rrz-background);
      --color-foreground: var(--rrz-foreground);
      --color-card: var(--rrz-card);
      --color-card-foreground: var(--rrz-card-foreground);
      --color-popover: var(--rrz-popover);
      --color-popover-foreground: var(--rrz-popover-foreground);
      --color-primary: var(--rrz-primary);
      --color-primary-foreground: var(--rrz-primary-foreground);
      --color-secondary: var(--rrz-secondary);
      --color-secondary-foreground: var(--rrz-secondary-foreground);
      --color-muted: var(--rrz-muted);
      --color-muted-foreground: var(--rrz-muted-foreground);
      --color-accent: var(--rrz-accent);
      --color-accent-foreground: var(--rrz-accent-foreground);
      --color-destructive: var(--rrz-destructive);
      --color-destructive-foreground: var(--rrz-destructive-foreground);
      --color-border: var(--rrz-border);
      --color-input: var(--rrz-input);
      --color-ring: var(--rrz-ring);
    }
    @layer base {
      body { background: var(--rrz-background); color: var(--rrz-foreground); }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased rrz-loading">

  <!-- 加载动画 -->
  <div id="rrz-loader">
    <div class="rrz-loader-vertical-bar">
      <div class="rrz-loader-progress"></div>
    </div>
    <div class="rrz-loader-percent">0%</div>
  </div>

  <!-- 背景粒子 -->
  <div class="rrz-bg-fx"><i></i><i></i><i></i><i></i><i></i></div>

  <!-- 导航栏 -->
  <nav class="w-full border-b rrz-site-nav" style="border-color: var(--rrz-border);">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 md:px-6 md:py-4">
      <div class="flex items-center gap-3">
        <a href="/" data-rrz-route class="rrz-logo text-sm font-semibold tracking-wide" style="color: var(--rrz-foreground);">rrztt.site</a>
      </div>
      <div class="hidden md:flex items-center gap-6 text-sm" style="color: var(--rrz-muted-foreground);">
        <a href="/" data-rrz-route class="rrz-link rrz-nav-link">首页</a>
        <a href="/about" data-rrz-route class="rrz-link rrz-nav-link">关于</a>
        <a href="/live" data-rrz-route class="rrz-link rrz-nav-link">直播</a>
        <a href="/music" data-rrz-route class="rrz-link rrz-nav-link">音乐</a>
      </div>
    </div>
  </nav>

  <!-- 游戏容器 -->
  <div id="game-wrapper">
    <!-- 开始菜单 -->
    <div id="start-menu" class="start-menu">
      <div class="menu-layout">
        <!-- 左侧按钮区域 -->
        <div class="menu-buttons">
          <h1 class="game-title">星猫降临</h1>
          <button class="menu-btn" data-action="start">开始游戏</button>
          <button class="menu-btn" data-action="home">返回主页</button>
          <button class="menu-btn" data-action="credits">制作组</button>
          <button class="menu-btn" data-action="about">关于</button>
          <div class="menu-version">Ver 1.0.0</div>
        </div>
        <!-- 右侧立绘区域 -->
        <div class="menu-character">
          <div class="character-aura"></div>
          <div class="character-aura aura-2"></div>
          <div class="character-aura aura-3"></div>
          <img src="../assets/ruoruozi-portrait.png" alt="星猫" class="character-sprite" />
        </div>
      </div>
    </div>

    <!-- 游戏主界面（隐藏） -->
    <div id="game-container" style="display: none;">
      <!-- 背景 -->
      <div class="game-background" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);"></div>
      
      <!-- 角色立绘 -->
      <div id="character-sprite" class="character-sprite-container" style="display: none;">
        <div class="character-aura"></div>
        <img src="../assets/ruoruozi-portrait.png" alt="星猫" class="character-sprite-img" />
      </div>

      <!-- 对话框 -->
      <div id="dialogue-box" class="dialogue-box" style="display: none;">
        <div class="character-name"></div>
        <div class="dialogue-text"></div>
        <div class="next-indicator">▼</div>
      </div>

      <!-- 选择框 -->
      <div id="choice-container" class="choice-container" style="display: none;"></div>
    </div>
  </div>

  <!-- 模态框 -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <button class="modal-close" onclick="closeModal()">关闭</button>
    </div>
  </div>

  <script src="galgame-core.js?v=20260808"></script>
  <script src="game-script.js?v=20260808"></script>
  <script>
    // 加载动画
    window.addEventListener('load', () => {
      const loader = document.getElementById('rrz-loader');
      const progress = loader.querySelector('.rrz-loader-progress');
      const percent = loader.querySelector('.rrz-loader-percent');
      
      let loadProgress = 0;
      const interval = setInterval(() => {
        loadProgress += Math.random() * 15;
        if (loadProgress >= 100) {
          loadProgress = 100;
          clearInterval(interval);
          progress.style.height = '100%';
          percent.textContent = '100%';
          percent.style.top = 'calc(100% - 60px)';
          percent.style.transform = 'translateY(-100%)';
          
          setTimeout(() => {
            loader.classList.add('is-done');
            document.body.classList.remove('rrz-loading');
            document.body.classList.add('rrz-ready');
            
            setTimeout(() => {
              loader.style.display = 'none';
            }, 900);
          }, 500);
        } else {
          progress.style.height = `${loadProgress}%`;
          percent.textContent = `${Math.floor(loadProgress)}%`;
          percent.style.top = `${loadProgress}%`;
          percent.style.transform = `translateY(-${100 - loadProgress}%)`;
        }
      }, 200);
    });

    // 开始菜单按钮事件
    document.querySelectorAll('#start-menu .menu-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const action = e.target.dataset.action;
        handleMenuAction(action);
      });
    });

    function handleMenuAction(action) {
      switch (action) {
        case 'start':
          startGame();
          break;
        case 'home':
          window.location.href = '/';
          break;
        case 'credits':
          showModal('制作组人员名单', `
            <div class="credits-content">
              <p class="credit-item"><strong>核心开发者</strong><br>HHmcME</p>
              <p class="credit-item"><strong>剧本设计</strong><br>HHmcME</p>
              <p class="credit-item"><strong>美术资源</strong><br>若若子天团</p>
              <p class="credit-item"><strong>特别感谢</strong><br>所有支持者</p>
            </div>
          `);
          break;
        case 'about':
          showModal('关于游戏', `
            <div class="about-content">
              <p>《星猫降临》是一部视觉小说作品。</p>
              <p>故事讲述了一位来自外星的猫娘与一位疲惫的打工人相遇，彼此救赎，最终走到一起的温暖故事。</p>
              <p>本游戏使用自定义 Galgame 引擎开发。</p>
              <p class="mt-4 text-sm opacity-70">类型：视觉小说 / 恋爱 / 救赎</p>
              <p class="text-sm opacity-70">预计游玩时间：30-45 分钟</p>
            </div>
          `);
          break;
      }
    }

    function startGame() {
      document.getElementById('start-menu').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        initGame();
      }, 500);
    }

    function showModal(title, content) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = content;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    // 点击遮罩关闭
    document.getElementById('modal-overlay')?.addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') {
        closeModal();
      }
    });
  </script>
</body>
</html>
