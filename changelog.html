<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更新日志 - 若若子官网</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="assets/css/style.css?v=20260808">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js" defer></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js" defer></script>
  <style>
    @theme inline {
      --color-background: #f8fafc;
      --color-foreground: #0f172a;
      --color-card: #ffffff;
      --color-primary: #6366f1;
      --color-secondary: #ec4899;
    }
  </style>
</head>
<body class="min-h-screen bg-background text-foreground">
  <!-- 导航栏 -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-card/90 backdrop-blur-md border-b">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-2xl font-bold" style="background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        若若子
      </a>
      <nav class="hidden md:flex gap-8">
        <a href="/" class="hover:text-primary transition-colors font-medium">首页</a>
        <a href="/about" class="hover:text-primary transition-colors font-medium">关于</a>
        <a href="/live" class="hover:text-primary transition-colors font-medium">直播</a>
        <a href="/music" class="hover:text-primary transition-colors font-medium">音乐</a>
      </nav>
      <button class="md:hidden p-2" aria-label="菜单">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="min-h-screen py-32 px-6">
    <div class="max-w-4xl mx-auto">
      <!-- 标题 -->
      <div class="text-center mb-16">
        <h1 class="text-5xl md:text-6xl font-bold mb-4" style="background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          更新日志
        </h1>
        <p class="text-lg text-text-secondary">
          记录若若子官网的发展历程
        </p>
      </div>

      <!-- 更新日志容器 -->
      <div id="changelog-container" class="space-y-8">
        <div class="text-center py-12">
          <div class="inline-block animate-spin" style="width: 40px; height: 40px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" stroke-dasharray="30 10"/>
            </svg>
          </div>
          <p class="mt-4 text-text-tertiary">正在加载更新日志...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="border-t">
    <div class="max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
      <p class="text-text-tertiary text-sm">
        © 2026 若若子 · rrztt.site
        <span class="mx-1">|</span>
        版权由 HHmcME 持有
      </p>
      <a href="https://space.bilibili.com/520292668" target="_blank" class="text-text-tertiary text-sm hover:text-primary transition-colors">
        Bilibili
      </a>
    </div>
  </footer>

  <!-- 加载历史脚本 -->
  <script src="assets/js/load-history.js?v=20260808"></script>

  <script>
    // 更新 changelog-container 为实际容器
    window.onload = function() {
      const container = document.getElementById('changelog-container');
      if (container && window.loadChangelog) {
        window.loadChangelog(container);
      }
    };
  </script>
</body>
</html>
